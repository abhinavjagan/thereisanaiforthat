services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aitools
      POSTGRES_PASSWORD: aitools
      POSTGRES_DB: aitools
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitools"]
      interval: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aitools:aitools@db:5432/aitools
    ports:
      - "8000:8000"
    command: python manage.py serve

volumes:
  pgdata:
